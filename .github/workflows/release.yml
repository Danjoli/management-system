name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer check
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Management System $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

